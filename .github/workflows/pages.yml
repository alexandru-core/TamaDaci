name: Deploy installer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
      - "**/*.ino"
      - "**/*.cpp"
      - "**/*.h"
      - "tools/build_web.sh"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10

      - name: Install firmware libraries
        run: arduino-cli lib install "GFX Library for Arduino" SensorLib XPowersLib U8g2

      - name: Install esptool
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: python -m pip install esptool==4.8.1

      - name: Build browser-installer firmware
        run: bash tools/build_web.sh --firmware-only

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload installer site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
